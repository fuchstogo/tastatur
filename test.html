<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tastatur-Check Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: eine zentrierte Arbeitsfläche, oben Fortschritt, darunter Aufgabe und die Tastatur als Hauptobjekt */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#18212e; --muted:#5b6778; --line:#d3d9e2;
  --cap:#f7f8fa; --cap-edge:#b9c1cd; --cap-ink:#232c39;
  --accent:#1d5bd6; --accent-ink:#ffffff; --accent-soft:#dfe8fb;
  --ok:#147a4a; --ok-soft:#dcf2e6; --bad:#b4322a; --bad-soft:#f8e0de; --warn:#94600a; --warn-soft:#fbefd6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161e; --surface:#19202b; --ink:#e7ecf3; --muted:#9aa6b6; --line:#2c3644;
  --cap:#242d3a; --cap-edge:#0b0f15; --cap-ink:#e3e9f1;
  --accent:#6f9cff; --accent-ink:#0c1424; --accent-soft:#1f2c48;
  --ok:#5fd09a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1f1d; --warn:#f0c060; --warn-soft:#3a2f17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161e; --surface:#19202b; --ink:#e7ecf3; --muted:#9aa6b6; --line:#2c3644;
  --cap:#242d3a; --cap-edge:#0b0f15; --cap-ink:#e3e9f1;
  --accent:#6f9cff; --accent-ink:#0c1424; --accent-soft:#1f2c48;
  --ok:#5fd09a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1f1d; --warn:#f0c060; --warn-soft:#3a2f17;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted);letter-spacing:0}
.who{color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.5vw,2.3rem);font-weight:800;line-height:1.15}
h2{font-size:1.25rem;font-weight:600}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
label{font-weight:700;font-size:.9rem}
input[type=text],input[type=password],textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
textarea{font-family:var(--mono);font-size:.8rem;min-height:70px}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px;font-weight:700}
a.btnlink{display:inline-block;text-decoration:none;border-radius:8px;padding:10px 18px;font-weight:700}
a.btnlink,button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.key:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;font-weight:400;font-size:.85rem}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tries{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.dot.used{background:var(--muted)}
.combo{min-height:52px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-weight:700;padding:10px 14px;border:2px dashed var(--line);border-radius:10px}
.combo .chip{background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);border-radius:6px;padding:3px 10px}
.combo .plus{color:var(--muted)}
.combo .hint{font-family:var(--body);font-weight:400;color:var(--muted)}
.fb{padding:12px 14px;border-radius:10px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.warn{background:var(--warn-soft);color:var(--warn)}
/* Tastatur */
.kbwrap{overflow-x:auto;padding:4px 2px 8px}
.kb{display:flex;gap:14px;align-items:flex-end;min-width:720px;font-size:clamp(10px,1.25vw,13px)}
.kbmain{flex:1;display:grid;grid-template-columns:repeat(60,1fr);grid-template-rows:3.6em .1em repeat(5,3.6em);gap:.35em}
.kbarrows{display:grid;grid-template-columns:repeat(3,3.6em);grid-template-rows:repeat(2,3.6em);gap:.35em}
.key{appearance:none;font:inherit;font-family:var(--mono);font-weight:500;color:var(--cap-ink);background:var(--cap);border:1px solid var(--cap-edge);border-bottom-width:3px;border-radius:.5em;padding:.25em .4em;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;line-height:1.1;cursor:pointer;min-width:0;transition:transform .06s,background .1s}
.key:active{transform:translateY(1px)}
.key .s{font-size:.82em;color:var(--muted)}
.key .m{font-size:1.15em}
.key.word .m{font-size:.92em}
.key.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.key.sel .s{color:var(--accent-ink);opacity:.8}
.key.sol{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.key.fkey{border-bottom-width:2px}
.kbgap{grid-column:1 / span 60}
/* Fragen */
.q{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:4px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
/* Auswertung */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--accent-soft)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:700;font-size:.82rem}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,15em) 1fr 3.5em;gap:10px;align-items:center;font-size:.88rem}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent)}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:.78rem;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Tastatur-Check · TEST<small>Tasten und Shortcuts unter Windows · Schweizer Tastatur</small></div>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
  <footer class="row" style="justify-content:space-between">
    <span class="muted" style="font-size:.85rem">OSC Bürgli</span>
    <button class="linkbtn" id="teacherLink" type="button">Auswertung (Lehrperson)</button>
  </footer>
</div>

<script>
/* ===================== Inhalte ===================== */
// Aufgaben: keys = richtige Tastenkombination (Reihenfolge egal), alt = weitere akzeptierte Lösungen
const TASKS = [
  {id:"copy",  p:"Kopieren", keys:["ctrl","c"]},
  {id:"at",    p:"Schreibe das Zeichen @", keys:["altgr","2"], alt:[["ctrl","alt","2"]]},
];

// Teil 2: Fragen zum Arbeitsblatt «Tasten»
const QUESTIONS = [
  {id:"q1", p:"Was ist der Unterschied zwischen Shift und Caps Lock?", o:[
    "Shift schaltet einmalig auf Grossbuchstaben um, Caps Lock dauerhaft.",
    "Caps Lock schaltet einmalig auf Grossbuchstaben um, Shift dauerhaft.",
    "Beide machen genau dasselbe.",
    "Shift löscht Zeichen, Caps Lock fügt Zeichen ein."], a:0},
];

const PW_HASH = "debc5ed9";
// Vorausgefüllter Microsoft-Forms-Link. In den Feldern stehen als Platzhalter: NAME, KLASSE, PUNKTE, CODE
const FORMS_URL = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=v3tHWyJg1Uam_tYFKtvUMpmEX1JlcGxKpFxPkz7vT31UMDdTT1RURUhEME1IRlY5QkhPVjQ1MDA2Ry4u&rc69727142b044b98bd745cab00ad2f95=NAME&r3099cdb54fc9499d9a8e808d8a7c41ec=KLASSE&r8a9aa4a2dd5645e587057b5fa4ceccde=PUNKTE&r85c22f8aa3424bebb21bba377b3cb206=CODE";
const MAX_TRIES = 2;

/* ===================== Tastatur (CH) ===================== */
const NAMES = {fn:"Fn",ctrl:"Strg (Ctrl)",shift:"Shift",alt:"Alt",altgr:"Alt Gr",win:"Win",tab:"Tab",caps:"Feststell",enter:"Enter",backspace:"Rücktaste",esc:"Esc",del:"Entf",print:"Druck",space:"Leertaste",menu:"Menü",left:"←",right:"→",up:"↑",down:"↓"};
for(let i=1;i<=12;i++) NAMES["f"+i]="F"+i;
const keyName = k => NAMES[k] || k.toUpperCase();
// [id, Breite in 1/4-Einheiten, Hauptlabel, Shift-Label]
const ROWS = [
  [["esc",4,"Esc"],...Array.from({length:12},(_,i)=>["f"+(i+1),4,"F"+(i+1)]),["print",4,"Druck"],["del",4,"Entf"]],
  [["§",4,"§","°"],["1",4,"1","+"],["2",4,"2","\""],["3",4,"3","*"],["4",4,"4","ç"],["5",4,"5","%"],["6",4,"6","&"],["7",4,"7","/"],["8",4,"8","("],["9",4,"9",")"],["0",4,"0","="],["'",4,"'","?"],["^",4,"^","`"],["backspace",8,"⟵ Rück"]],
  [["tab",7,"Tab ⇥"],..."qwertzuiop".split("").map(c=>[c,4,c.toUpperCase()]),["ü",4,"ü","è"],["¨",4,"¨","!"],["enter",5,"Enter ↵",null,2]],
  [["caps",7,"⇪ Fest"],..."asdfghjkl".split("").map(c=>[c,4,c.toUpperCase()]),["ö",4,"ö","é"],["ä",4,"ä","à"],["$",4,"$","£"]],
  [["shift",5,"⇧"],["<",4,"<",">"],..."yxcvbnm".split("").map(c=>[c,4,c.toUpperCase()]),[",",4,",",";"],[".",4,".",":"],["-",4,"-","_"],["shift",11,"⇧ Shift"]],
  [["ctrl",6,"Strg"],["fn",4,"Fn"],["win",4,"⊞ Win"],["alt",5,"Alt"],["space",24,""],["altgr",6,"Alt Gr"],["menu",4,"☰"],["ctrl",7,"Strg"]],
];

/* ===================== Zustand ===================== */
let S = null; // Prüfungszustand
const store = {
  get(){ try{
    const raw=localStorage.getItem("tk-state-test"); if(!raw) return null;
    const [b,sg]=raw.split("~"); const json=decodeURIComponent(escape(xorStr(atob(b))));
    const v=JSON.parse(json); if(sig(json)!==sg) v.tampered=true; return v;
  }catch{ return localStorage.getItem("tk-state-test")?{broken:true}:null; } },
  set(v){ try{ const json=JSON.stringify(v); localStorage.setItem("tk-state-test", btoa(xorStr(unescape(encodeURIComponent(json))))+"~"+sig(json)); }catch{} },
  clear(){ try{ localStorage.removeItem("tk-state-test"); }catch{} },
  starts(){ try{ return +(localStorage.getItem("tk-n-test")||0); }catch{ return 0; } },
  addStart(){ try{ const n=this.starts()+1; localStorage.setItem("tk-n-test",String(n)); return n; }catch{ return 1; } }
};
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const comboStr = keys => keys.map(keyName).join(" + ");
function fnv(s){let x=0x811c9dc5;for(const c of s){x^=c.codePointAt(0);x=Math.imul(x,0x01000193)>>>0}return x.toString(16)}

/* ===================== Plattform (Speicher) ===================== */
let db=null, uid=null, user=null;
const capReady = (async()=>{
  try{
    if(!window.claude?.use) return;
    db = await window.claude.use("db");
    user = await window.claude.use("user");
    if(user) uid = await user.id();
  }catch(e){ db=null; }
})();

/* ===================== Ansichten ===================== */
function setWho(){ document.getElementById("who").textContent = S ? `${S.name}${S.klasse?" · "+S.klasse:""}` : ""; }

let unlocked=false;
function viewLogin(){
  setWho();
  const saved = store.get();
  const locked = !unlocked && (store.starts()>0 || !!saved);
  $app.innerHTML = `
  <section class="panel">
    <span class="eyebrow">Anmeldung</span>
    <h1>Zeig, was du auf der Tastatur kannst.</h1>
    <p class="muted">Teil 1: Du klickst Tasten und Tastenkombinationen auf der Bildschirm-Tastatur an. Pro Aufgabe hast du ${MAX_TRIES} Versuche. Teil 2: Fragen zu den Arbeitsblättern.</p>
    <p class="muted">Benutze nur die Maus. Echte Tastenkombinationen auf deiner Tastatur werden nicht gezählt.</p>
    ${saved && !saved.broken && !saved.done ? `<div class="fb warn">Für ${esc(saved.name)} gibt es einen angefangenen Durchgang. <button type="button" id="resume" style="margin-left:8px">Weitermachen</button></div>`:""}
    ${saved && !saved.broken && saved.done ? `<div class="fb ok">${esc(saved.name)} hat bereits abgegeben. <button type="button" id="resume" style="margin-left:8px">Abgabe anzeigen</button></div>`:""}
    ${locked ? `<div class="fb warn">Auf diesem Gerät wurde schon ein Durchgang gestartet. Einen neuen Durchgang kann nur die Lehrperson freigeben.</div>
    <form id="unlockForm" class="row"><div class="field" style="flex:1;min-width:200px"><label for="upw">Passwort der Lehrperson</label><input type="password" id="upw" autocomplete="off"></div><button type="submit" style="align-self:flex-end">Freigeben</button></form>
    <div id="upwMsg" class="fb bad" hidden>Falsches Passwort.</div>`:""}
    <form id="loginForm" class="grid2" ${locked?"hidden":""}>
      <div class="field"><label for="nm">Vorname und Nachname</label><input type="text" id="nm" autocomplete="off" required minlength="3" placeholder="z. B. Lena Keller"></div>
      <div class="field"><label for="kl">Klasse</label><input type="text" id="kl" autocomplete="off" placeholder="z. B. 1a"></div>
      <div><button class="primary" type="submit">Starten</button></div>
    </form>
  </section>`;
  document.getElementById("resume")?.addEventListener("click",()=>{ S=saved; route(); });
  document.getElementById("unlockForm")?.addEventListener("submit",e=>{
    e.preventDefault();
    if(fnv(document.getElementById("upw").value)===PW_HASH){ unlocked=true; store.clear(); viewLogin(); }
    else document.getElementById("upwMsg").hidden=false;
  });
  document.getElementById("loginForm").addEventListener("submit",e=>{
    e.preventDefault();
    const name=document.getElementById("nm").value.trim().replace(/\s+/g," ");
    if(name.length<3) return;
    unlocked=false;
    S={ name, klasse:document.getElementById("kl").value.trim(), start:Date.now(), starts:store.addStart(),
        order:shuffle(TASKS.map(t=>t.id)), i:0, tries:0, sel:[], phase:"task", items:{}, answers:{}, done:false, runId:Date.now().toString(36)+Math.random().toString(36).slice(2,7) };
    store.set(S); route();
  });
}

function keyboardHTML(sel, sol){
  const has = (arr,k)=>arr&&arr.includes(k);
  let html='<div class="kbwrap"><div class="kb"><div class="kbmain">';
  ROWS.forEach((row,ri)=>{
    let col=1;
    row.forEach(([id,w,main,shift,rs])=>{
      const cls=["key"]; if(main.length>2||id==="space") cls.push("word"); if(ri===0) cls.push("fkey");
      if(has(sel,id)) cls.push("sel"); if(has(sol,id)) cls.push("sol");
      const gr = ri+1 + (ri>0?1:0); // Abstand nach F-Reihe
      html+=`<button type="button" class="${cls.join(" ")}" data-k="${esc(id)}" aria-label="${esc(keyName(id))}" style="grid-column:${col} / span ${w};grid-row:${gr} / span ${rs||1}">`+
            (shift?`<span class="s">${esc(shift)}</span>`:"<span class='s'></span>")+`<span class="m">${esc(main)}</span></button>`;
      col+=w;
    });
    if(ri===0) html+=`<div class="kbgap" style="grid-row:2"></div>`;
  });
  html+='</div><div class="kbarrows">';
  [["up",2,1],["left",1,2],["down",2,2],["right",3,2]].forEach(([id,c,r])=>{
    const cls=["key"]; if(has(sel,id)) cls.push("sel"); if(has(sol,id)) cls.push("sol");
    html+=`<button type="button" class="${cls.join(" ")}" data-k="${id}" aria-label="Pfeil ${keyName(id)}" style="grid-column:${c};grid-row:${r}"><span class="s"></span><span class="m">${NAMES[id]}</span></button>`;
  });
  return html+'</div></div></div>';
}

function currentTask(){ return TASKS.find(t=>t.id===S.order[S.i]); }
function isCorrect(task, sel){
  const norm=a=>[...new Set(a)].sort().join("+");
  return [task.keys,...(task.alt||[])].some(k=>norm(k)===norm(sel));
}

function viewTask(fb){
  setWho();
  const t=currentTask(), n=S.order.length, total=n+QUESTIONS.length;
  const locked = !!fb && (fb.type==="ok" || fb.type==="final");
  const sol = null;
  $app.innerHTML=`
  <section class="panel">
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow">Teil 1 · Aufgabe ${S.i+1} von ${n}</span>
      <span class="tries" aria-label="Versuche">${Array.from({length:MAX_TRIES},(_,i)=>`<span class="dot ${i<S.tries?"used":""}"></span>`).join("")} Versuche</span>
    </div>
    <div class="progress"><i style="width:${(S.i/total)*100}%"></i></div>
    <h1>${esc(t.p)}</h1>
    <div class="combo" id="combo" aria-live="polite">${S.sel.length?S.sel.map(k=>`<span class="chip">${esc(keyName(k))}</span>`).join('<span class="plus">+</span>'):'<span class="hint">Klicke die Tasten an. Nochmals klicken hebt die Auswahl auf.</span>'}</div>
    ${keyboardHTML(S.sel, sol)}
    ${fb?`<div class="fb ${fb.type==="ok"?"ok":fb.type==="final"?"bad":"warn"}">${esc(fb.msg)}</div>`:""}
    <div class="row">
      ${locked?`<button class="primary" type="button" id="next">Weiter</button>`:
      `<button class="primary" type="button" id="check" ${S.sel.length?"":"disabled"}>Prüfen</button><button type="button" id="reset">Zurücksetzen</button>`}
    </div>
  </section>`;
  if(!locked){
    $app.querySelectorAll(".key").forEach(b=>b.addEventListener("click",()=>{
      const k=b.dataset.k; S.sel = S.sel.includes(k)? S.sel.filter(x=>x!==k) : [...S.sel,k];
      store.set(S); viewTask(fb && fb.type==="retry"?fb:null);
    }));
    document.getElementById("reset").onclick=()=>{S.sel=[];store.set(S);viewTask(fb&&fb.type==="retry"?fb:null);};
    document.getElementById("check").onclick=()=>{
      S.tries++;
      const ans=comboStr(S.sel), rec=S.items[t.id]||{id:t.id,a:[]};
      rec.a.push(ans);
      if(isCorrect(t,S.sel)){
        rec.ok=true; rec.tries=S.tries; S.items[t.id]=rec; store.set(S);
        viewTask({type:"ok",msg:S.tries===1?"Richtig!":"Richtig, im zweiten Versuch."});
      }else if(S.tries<MAX_TRIES){
        S.items[t.id]=rec; S.sel=[]; store.set(S);
        viewTask({type:"retry",msg:`Leider falsch (${ans}). Du hast noch ${MAX_TRIES-S.tries} Versuch.`});
      }else{
        rec.ok=false; rec.tries=S.tries; S.items[t.id]=rec; S.sel=[]; store.set(S);
        viewTask({type:"final",msg:"Leider falsch. Diese Aufgabe gibt keinen Punkt."});
      }
    };
  }else{
    document.getElementById("next").onclick=()=>{
      S.i++; S.tries=0; S.sel=[];
      if(S.i>=S.order.length) S.phase="questions";
      store.set(S); route();
    };
    document.getElementById("next").focus();
  }
}

function viewQuestions(){
  setWho();
  const total=S.order.length+QUESTIONS.length;
  $app.innerHTML=`
  <section class="panel">
    <span class="eyebrow">Teil 2 · Fragen zum Arbeitsblatt</span>
    <div class="progress"><i style="width:${(S.order.length/total)*100}%"></i></div>
    <h1>Wähle jeweils die richtige Antwort.</h1>
    <form id="qForm" style="display:flex;flex-direction:column;gap:18px">
      ${QUESTIONS.map((q,qi)=>`
      <fieldset class="q" style="border:0;padding:0;margin:0">
        <legend style="font-weight:700;margin-bottom:8px">${qi+1}. ${esc(q.p)}</legend>
        <div class="opts">${q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="${q.id}" id="${q.id}_${oi}" value="${oi}" ${S.answers[q.id]===oi?"checked":""}><span style="font-weight:400">${esc(o)}</span></label>`).join("")}</div>
      </fieldset>`).join("")}
      <div id="qMsg" class="fb warn" hidden></div>
      <div><button class="primary" type="submit">Abgeben</button></div>
    </form>
  </section>`;
  const f=document.getElementById("qForm");
  f.addEventListener("change",e=>{ if(e.target.name){ S.answers[e.target.name]=+e.target.value; store.set(S);} });
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const open=QUESTIONS.filter(q=>S.answers[q.id]===undefined).length;
    const m=document.getElementById("qMsg");
    if(open){ m.hidden=false; m.textContent=`Es ${open===1?"fehlt noch 1 Antwort":`fehlen noch ${open} Antworten`}.`; return; }
    finish();
  });
}

function buildRun(){
  const items=S.order.map(id=>{const r=S.items[id]||{id,a:[],ok:false,tries:0};return{id,ok:!!r.ok,tries:r.tries||0,a:r.a.join(" | ")};});
  const q=QUESTIONS.map(x=>({id:x.id,ok:S.answers[x.id]===x.a,a:S.answers[x.id]??-1}));
  const sPts=items.reduce((s,i)=>s+(i.ok?(i.tries===1?1:0.5):0),0);
  const qPts=q.filter(x=>x.ok).length;
  return {v:1,runId:S.runId,name:S.name,klasse:S.klasse,start:S.start,end:S.end||(S.end=Date.now()),items,q,sPts,sMax:items.length,qPts,qMax:q.length,starts:S.starts||1,tampered:!!S.tampered};
}
function encodeRun(run){
  const json=JSON.stringify(run);
  const b=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return `TK1.${b}.${fnv(json)}`;
}
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(b){b=b.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";return decodeURIComponent(escape(atob(b)));}
const SALT="osc-buergli-7x";
function xorStr(str){const k=SALT+"k";let o="";for(let i=0;i<str.length;i++)o+=String.fromCharCode(str.charCodeAt(i)^k.charCodeAt(i%k.length)^((i*31)&255));return o;}
function sig(json){return fnv(SALT+json+SALT.split("").reverse().join(""))+fnv(json+SALT);}
function encodeShort(run){
  const it=TASKS.map(t=>{const i=run.items.find(x=>x.id===t.id);return !i||!i.ok?"0":String(i.tries);}).join("");
  const qa=QUESTIONS.map(q=>{const x=run.q.find(y=>y.id===q.id);return x&&x.a>=0?String(x.a):"9";}).join("");
  const json=JSON.stringify([run.name,run.klasse,run.start.toString(36),run.end.toString(36),it,qa,run.starts||1,run.tampered?1:0]);
  return `TK3.${btoa(xorStr(unescape(encodeURIComponent(json)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}.${sig(json)}`;
}
function decodeShort(code){
  const m=code.trim().match(/^TK3\.([A-Za-z0-9_-]+)\.([0-9a-f]+)$/);
  if(!m) return null;
  try{
    let b=m[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
    const json=decodeURIComponent(escape(xorStr(atob(b)))); if(sig(json)!==m[2]) return null;
    const [name,klasse,st,en,it,qa,starts,tp]=JSON.parse(json);
    const items=TASKS.map((t,k)=>{const d=+(it[k]||0);return{id:t.id,ok:d>0,tries:d||MAX_TRIES,a:""};});
    const q=QUESTIONS.map((x,k)=>{const a=+(qa[k]??9);return{id:x.id,ok:a===x.a,a:a===9?-1:a};});
    const sPts=items.reduce((s,i)=>s+(i.ok?(i.tries===1?1:0.5):0),0), qPts=q.filter(x=>x.ok).length;
    return {v:2,runId:"c"+m[2],name,klasse,start:parseInt(st,36),end:parseInt(en,36),items,q,sPts,sMax:items.length,qPts,qMax:q.length,starts:starts||1,tampered:!!tp};
  }catch{ return null; }
}
function formsLink(run,code){
  if(!FORMS_URL) return "";
  try{
    const u=new URL(FORMS_URL), map={NAME:run.name,KLASSE:run.klasse||"-",PUNKTE:"siehe Auswertung",CODE:code};
    for(const [k,v] of [...u.searchParams]) if(map[v.trim().toUpperCase()]!==undefined) u.searchParams.set(k,map[v.trim().toUpperCase()]);
    return u.toString();
  }catch{ return ""; }
}
function decodeRun(code){
  if(/^TK3\./.test(code.trim())) return decodeShort(code);
  const m=code.trim().match(/^TK1\.([A-Za-z0-9_-]+)\.([0-9a-f]+)$/);
  if(!m) return null;
  try{
    let b=m[1].replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
    const json=decodeURIComponent(escape(atob(b)));
    if(fnv(json)!==m[2]) return null;
    return JSON.parse(json);
  }catch{ return null; }
}

async function finish(){
  S.done=true; S.phase="done"; buildRun(); store.set(S);
  const run=buildRun();
  $app.innerHTML=`<section class="panel"><span class="eyebrow">Abgabe</span><h1>Wird gespeichert …</h1></section>`;
  let saved=false;
  await capReady;
  if(db && uid){
    try{
      await db.doc(`results/${uid}`).set({last:run.end,name:run.name});
      await db.doc(`results/${uid}/runs/${run.runId}`).set(run);
      saved=true;
    }catch(e){ saved=false; }
  }
  S.saved=saved; store.set(S);
  viewDone(run,saved);
}

function viewDone(run,saved){
  setWho();
  const code=encodeShort(run), link=formsLink(run,code);
  $app.innerHTML=`
  <section class="panel">
    <span class="eyebrow">Fertig</span>
    <h1>Danke, ${esc(run.name.split(" ")[0])}. Du bist fertig.</h1>
    ${saved?`<div class="fb ok">Dein Ergebnis wurde gespeichert. Deine Lehrperson sieht es in der Auswertung.</div>`:
      link?`<div class="fb warn">Noch nicht abgegeben! Klicke auf «Abgabe senden». Im Formular ist alles schon ausgefüllt, du klickst nur noch auf «Senden».</div>
      <div><a class="primary btnlink" href="${esc(link)}" target="_blank" rel="noopener">Abgabe senden</a></div>`:
    `<div class="fb warn">Dein Ergebnis konnte nicht automatisch gespeichert werden. Kopiere den Abgabe-Code unten und schicke ihn deiner Lehrperson (z. B. per Teams oder Mail).</div>`}
    <div class="field">
      <label for="code">Abgabe-Code${saved?" (Reserve)":""}</label>
      <div class="code" id="code">${esc(code)}</div>
      <div class="row"><button type="button" id="copy">Code kopieren</button><span class="muted" id="copied" aria-live="polite"></span></div>
    </div>
    <div><button type="button" id="again" class="linkbtn">Neue Anmeldung</button></div>
  </section>`;
  document.getElementById("copy").onclick=async()=>{
    const out=document.getElementById("copied");
    try{ await navigator.clipboard.writeText(code); out.textContent="Kopiert."; }
    catch{ const r=document.createRange(); r.selectNodeContents(document.getElementById("code")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); out.textContent="Markiert. Jetzt mit Strg + C kopieren."; }
  };
  document.getElementById("again").onclick=()=>{ S=null; viewLogin(); };
}

/* ===================== Auswertung (Lehrperson) ===================== */
let teacherOpen=false, runs=[];
function viewTeacherLogin(){
  setWho();
  $app.innerHTML=`
  <section class="panel">
    <span class="eyebrow">Lehrperson</span>
    <h1>Auswertung</h1>
    <form id="pwForm" class="row">
      <div class="field" style="flex:1;min-width:200px"><label for="pw">Passwort</label><input type="password" id="pw" autocomplete="off"></div>
      <button class="primary" type="submit" style="align-self:flex-end">Öffnen</button>
      <button type="button" id="back" style="align-self:flex-end">Zurück</button>
    </form>
    <div id="pwMsg" class="fb bad" hidden>Falsches Passwort.</div>
  </section>`;
  document.getElementById("pw").focus();
  document.getElementById("back").onclick=()=>route();
  document.getElementById("pwForm").addEventListener("submit",e=>{
    e.preventDefault();
    if(fnv(document.getElementById("pw").value)===PW_HASH){ teacherOpen=true; loadRuns(); }
    else document.getElementById("pwMsg").hidden=false;
  });
}

async function loadRuns(){
  $app.innerHTML=`<section class="panel"><span class="eyebrow">Auswertung</span><h1>Ergebnisse werden geladen …</h1></section>`;
  await capReady;
  runs=[]; let note="";
  if(db){
    try{
      const top=await db.collection("results").get();
      for(const d of top.docs){
        const r=await db.collection(`results/${d.id}/runs`).get();
        r.docs.forEach(x=>runs.push({...x.data(),src:"online"}));
      }
      const imp=await db.collection("imports").get();
      imp.docs.forEach(x=>runs.push({...x.data(),src:"Code"}));
    }catch(e){ note="Die gespeicherten Ergebnisse konnten nicht geladen werden."; }
  }else note="Hier gibt es keinen Online-Speicher. Füge die Abgabe-Codes aus der Forms-Tabelle unten ein. Sie bleiben in diesem Browser gespeichert.";
  localImports().forEach(c=>{const r=decodeRun(c); if(r) runs.push({...r,src:"Code"});});
  const seen=new Set(); runs=runs.filter(r=>r&&r.runId&&!seen.has(r.runId)&&seen.add(r.runId));
  runs.sort((a,b)=>(a.klasse||"").localeCompare(b.klasse||"")||a.name.localeCompare(b.name)||b.end-a.end);
  viewTeacher(note);
}

const pct=r=>Math.round(100*(r.sPts+r.qPts)/Math.max(1,r.sMax+r.qMax));
const pillCls=p=>p>=80?"ok":p>=55?"warn":"bad";
const fmtDate=t=>new Date(t).toLocaleString("de-CH",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});

function localImports(){ try{ return JSON.parse(localStorage.getItem("tk-imports-test")||"[]"); }catch{ return []; } }
function addLocalImport(code){ try{ const a=localImports(); if(!a.includes(code)){a.push(code);localStorage.setItem("tk-imports-test",JSON.stringify(a));} }catch{} }
function viewTeacher(note, detailId){
  const classes=[...new Set(runs.map(r=>r.klasse||"–"))];
  const filter=viewTeacher.filter||"alle";
  const list=runs.filter(r=>filter==="alle"||(r.klasse||"–")===filter);
  const avg=list.length?Math.round(list.reduce((s,r)=>s+pct(r),0)/list.length):0;
  const taskStats=TASKS.map(t=>{const rs=list.map(r=>r.items.find(i=>i.id===t.id)).filter(Boolean);return{t,n:rs.length,first:rs.filter(i=>i.ok&&i.tries===1).length,ok:rs.filter(i=>i.ok).length};}).sort((a,b)=>(a.ok/(a.n||1))-(b.ok/(b.n||1)));
  const d=detailId?runs.find(r=>r.runId===detailId):null;
  $app.innerHTML=`
  <section class="panel">
    <div class="row" style="justify-content:space-between">
      <div><span class="eyebrow">Lehrperson</span><h1>Auswertung</h1></div>
      <div class="row"><button type="button" id="reload">Aktualisieren</button><button type="button" id="csv">Als Tabelle kopieren</button><button type="button" id="logout">Schliessen</button></div>
    </div>
    ${note?`<div class="fb warn">${esc(note)}</div>`:""}
    <div class="row"><label for="cls">Klasse</label>
      <select id="cls" style="font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
        <option value="alle">Alle</option>${classes.map(c=>`<option ${c===filter?"selected":""}>${esc(c)}</option>`).join("")}
      </select><span class="muted" id="csvMsg" aria-live="polite"></span></div>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Abgaben</span><b>${list.length}</b></div>
      <div class="stat"><span class="eyebrow">Durchschnitt</span><b>${list.length?avg+" %":"–"}</b></div>
      <div class="stat"><span class="eyebrow">Shortcuts</span><b>${TASKS.length}</b><span class="muted">1 P. im 1. Versuch, ½ P. im 2.</span></div>
      <div class="stat"><span class="eyebrow">Fragen</span><b>${QUESTIONS.length}</b><span class="muted">je 1 Punkt</span></div>
    </div>
  </section>

  ${d?detailHTML(d):""}

  <section class="panel">
    <h2>Schüler:innen</h2>
    ${list.length?`<div class="tablewrap"><table>
      <thead><tr><th>Name</th><th>Klasse</th><th>Abgabe</th><th>Shortcuts</th><th>Fragen</th><th>Total</th><th>Hinweis</th><th>Quelle</th></tr></thead>
      <tbody>${list.map(r=>`<tr class="clickable" data-id="${esc(r.runId)}" tabindex="0">
        <td><b>${esc(r.name)}</b></td><td>${esc(r.klasse||"–")}</td><td class="num">${fmtDate(r.end)}</td>
        <td class="num">${r.sPts} / ${r.sMax}</td><td class="num">${r.qPts} / ${r.qMax}</td>
        <td><span class="pill ${pillCls(pct(r))}">${pct(r)} %</span></td><td>${r.tampered?'<span class="pill bad">manipuliert</span> ':""}${(r.starts||1)>1?`<span class="pill warn">${r.starts}. Durchgang</span>`:""}</td><td class="muted">${r.src}</td></tr>`).join("")}</tbody>
    </table></div><p class="muted" style="font-size:.85rem">Zeile anklicken für die Details.</p>`:
    `<p class="muted">Noch keine Abgaben. Sobald Schüler:innen fertig sind, erscheinen sie hier. Abgabe-Codes kannst du unten einfügen.</p>`}
  </section>

  ${list.length?`<section class="panel">
    <h2>Welche Aufgaben waren schwierig?</h2>
    <p class="muted">Anteil richtig gelöst (1. oder 2. Versuch), die schwierigsten zuerst.</p>
    <div class="bars">${taskStats.map(s=>`<div class="bar"><span class="t" title="${esc(s.t.p)}">${esc(s.t.p)}</span><span class="track"><i style="width:${s.n?100*s.ok/s.n:0}%"></i></span><span class="v">${s.n?Math.round(100*s.ok/s.n):0} %</span></div>`).join("")}</div>
  </section>`:""}

  <section class="panel">
    <h2>Abgabe-Codes einfügen</h2>
    <p class="muted">Codes aus der Forms-Tabelle (Spalte «Code») hier einfügen. Du kannst die ganze Spalte auf einmal kopieren.</p>
    <textarea id="codes" aria-label="Abgabe-Codes"></textarea>
    <div class="row"><button type="button" id="import">Codes übernehmen</button><span class="muted" id="impMsg" aria-live="polite"></span></div>
  </section>`;

  document.getElementById("cls").onchange=e=>{viewTeacher.filter=e.target.value;viewTeacher(note);};
  document.getElementById("reload").onclick=loadRuns;
  document.getElementById("logout").onclick=()=>{teacherOpen=false;runs=[];route();};
  $app.querySelectorAll("tr.clickable").forEach(tr=>{
    const open=()=>{viewTeacher(note,tr.dataset.id);document.getElementById("detail")?.scrollIntoView({behavior:"smooth",block:"start"});};
    tr.onclick=open; tr.onkeydown=e=>{if(e.key==="Enter")open();};
  });
  document.getElementById("closeDetail")?.addEventListener("click",()=>viewTeacher(note));
  document.getElementById("csv").onclick=async()=>{
    const head=["Name","Klasse","Abgabe","Shortcuts","Shortcuts max","Fragen","Fragen max","Total %",...TASKS.map(t=>t.p),...QUESTIONS.map(q=>q.p)];
    const rows=list.map(r=>[r.name,r.klasse,fmtDate(r.end),r.sPts,r.sMax,r.qPts,r.qMax,pct(r),
      ...TASKS.map(t=>{const i=r.items.find(x=>x.id===t.id);return !i?"":i.ok?(i.tries===1?"1":"0.5"):"0";}),
      ...QUESTIONS.map(q=>{const i=r.q.find(x=>x.id===q.id);return i&&i.ok?"1":"0";})]);
    const tsv=[head,...rows].map(r=>r.map(c=>String(c??"").replace(/\t|\n/g," ")).join("\t")).join("\n");
    const m=document.getElementById("csvMsg");
    try{await navigator.clipboard.writeText(tsv);m.textContent="Kopiert. In Excel einfügen.";}
    catch{m.textContent="Kopieren hat nicht geklappt.";}
  };
  document.getElementById("import").onclick=async()=>{
    const lines=document.getElementById("codes").value.split(/\s+/).filter(Boolean);
    const m=document.getElementById("impMsg"); let ok=0, bad=0, badList=[];
    for(const l of lines){
      const r=decodeRun(l);
      if(!r){bad++;badList.push(l.slice(0,24)+"…");continue;}
      if(db){ try{ await db.doc(`imports/${r.runId}`).set(r); }catch{} } else addLocalImport(l);
      if(!runs.some(x=>x.runId===r.runId)) runs.push({...r,src:"Code"});
      ok++;
    }
    m.textContent=`${ok} übernommen${bad?`, ${bad} ungültig oder verändert: ${badList.join(", ")}`:""}.`;
    if(ok) setTimeout(()=>viewTeacher(note),700);
  };
}

function detailHTML(r){
  const qtxt=(q,a)=>a>=0?q.o[a]:"keine Antwort";
  return `<section class="panel" id="detail">
    <div class="row" style="justify-content:space-between">
      <div><span class="eyebrow">Details</span><h2>${esc(r.name)} · ${esc(r.klasse||"–")}</h2><span class="muted">${fmtDate(r.start)} bis ${fmtDate(r.end)} · ${Math.max(1,Math.round((r.end-r.start)/60000))} Min.</span></div>
      <button type="button" id="closeDetail">Details schliessen</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Aufgabe</th><th>Ergebnis</th><th>Eingabe</th><th>Lösung</th></tr></thead>
      <tbody>${r.items.map(i=>{const t=TASKS.find(x=>x.id===i.id)||{p:i.id,keys:[]};
        const st=i.ok?(i.tries===1?["ok","1. Versuch"]:["warn","2. Versuch"]):["bad","falsch"];
        return `<tr><td>${esc(t.p)}</td><td><span class="pill ${st[0]}">${st[1]}</span></td><td class="num">${esc(i.a||(i.ok?"":"–"))}</td><td class="num">${esc(comboStr(t.keys))}</td></tr>`;}).join("")}
      ${r.q.map(x=>{const q=QUESTIONS.find(y=>y.id===x.id);if(!q)return"";
        return `<tr><td>${esc(q.p)}</td><td><span class="pill ${x.ok?"ok":"bad"}">${x.ok?"richtig":"falsch"}</span></td><td style="white-space:normal">${esc(qtxt(q,x.a))}</td><td style="white-space:normal">${esc(q.o[q.a])}</td></tr>`;}).join("")}
      </tbody></table></div>
  </section>`;
}

/* ===================== Router ===================== */
function route(){
  if(!S || !S.name) return viewLogin();
  if(S.phase==="task") return viewTask();
  if(S.phase==="questions") return viewQuestions();
  if(S.phase==="done") return viewDone(buildRun(), !!S.saved);
  viewLogin();
}
document.getElementById("teacherLink").onclick=()=>teacherOpen?loadRuns():viewTeacherLogin();
// Echte Tastendrücke werden ignoriert, damit keine Systemkürzel ausgelöst werden.
route();
</script>
